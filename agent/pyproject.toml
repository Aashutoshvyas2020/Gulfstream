[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antibody"
version = "0.3.0"
description = "Antibody: an immune system for buildings. 14 AI agents hunt 14 kinds of failure."
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.39.0,<=1.39.0", "openai>=2.16.0,<3.0.0", "sentience-governor>=0.3.2.1,<0.4"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "aashu"
fab-format-version = 1
flwr-version-target = "1.39.0"
fab-include = ["agent/**/*.py", "LICENSE"]

[tool.flwr.app.config]
# Scan settings, read by agent_app.configure() from context.run_config. They travel with
# the app to SuperGrid; ANTIBODY_<NAME> environment variables override them on a local
# SuperLink (e.g. ANTIBODY_PARALLEL_AGENTS=1 for Ollama, which is automatic).
parallel-agents = 10
max-tool-turns = 2
top-alerts = 2
investigate = true
investigate-timeout = 30.0
alert-timeout = 60.0
specialist-max-output-tokens = 2000
alert-max-output-tokens = 1800
reasoning-effort = "low"
reassess-after-fix = false

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"
