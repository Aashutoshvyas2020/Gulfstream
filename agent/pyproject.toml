[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antibody"
version = "0.3.0"
description = "Antibody: an immune system for buildings. 11 AI agents hunt 11 kinds of failure."
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.38.0,<2.0", "openai>=2.16.0,<3.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "local"
fab-format-version = 1
flwr-version-target = "1.38.0"
fab-include = ["agent/**/*.py", "LICENSE"]

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"
